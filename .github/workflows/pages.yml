# Publishes website/ (incl. the playable web version under /play) and the
# Gipfelsturm game (under /gipfelsturm) to GitHub Pages.
# Enable once under Settings → Pages → Source: "GitHub Actions".
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r website/. _site/
          cp -r gipfelsturm _site/gipfelsturm
          rm -rf _site/gipfelsturm/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
