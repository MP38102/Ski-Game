<!doctype html>
<!-- Store cover art (CrazyGames & co.). Rendered at several sizes by tools/build-crazygames.mjs -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, #8EDBFF, #2F6FEB 78%); position: relative; }
  .shot { position: absolute; background: #0E1624; border-radius: 3vmin; padding: 1.4vmin; box-shadow: 0 4vmin 8vmin rgba(16,38,63,.45); }
  .shot img { display: block; width: 100%; border-radius: 1.6vmin; }
  .logo { position: absolute; filter: drop-shadow(0 1.5vmin 2.5vmin rgba(16,38,63,.4)); }
  .yeti { position: absolute; filter: drop-shadow(0 2vmin 3vmin rgba(16,38,63,.4)); }
  svg.m { position: absolute; left: 0; bottom: 0; width: 100%; height: 18%; }
  /* landscape */
  .land .logo { left: 4%; top: 26%; width: 46%; }
  .land .shot { right: -6%; top: 12%; width: 54%; transform: rotate(-4deg); }
  .land .yeti { display: none; }
  /* portrait */
  .port .logo { left: 8%; top: 5%; width: 84%; }
  .port .shot { left: 8%; top: 36%; width: 92%; transform: rotate(-5deg); }
  .port .yeti { display: none; }
</style></head>
<body>
  <img class="logo" src="../brand/logo.svg">
  <img class="yeti" src="../brand/yeti-mark.svg">
  <div class="shot"><img src="../website/img/shot-yeti.png"></div>
  <svg class="m" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 Q 300 20 600 60 T 1200 50 V120 H0Z" fill="#F7FBFF"/></svg>
  <script>document.body.className = innerWidth >= innerHeight ? 'land' : 'port';</script>
</body></html>
