<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Fredoka'; src: url('../game/fonts/fredoka-latin-700-normal.woff2'); font-weight: 700; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: Fredoka, sans-serif;
    background: linear-gradient(180deg, #8EDBFF, #2F6FEB 75%); position: relative; }
  .logo { position: absolute; left: 50px; top: 90px; width: 560px; filter: drop-shadow(0 12px 18px rgba(16,38,63,.35)); }
  .tag { position: absolute; left: 60px; top: 460px; color: #fff; font-size: 38px; font-weight: 700; text-shadow: 0 3px 0 rgba(16,38,63,.35); width: 560px; line-height: 1.2; }
  .ipad { position: absolute; right: -60px; top: 80px; width: 640px; background: #0E1624; border-radius: 30px; padding: 16px; transform: rotate(-4deg); box-shadow: 0 30px 60px rgba(16,38,63,.45); }
  .ipad img { width: 100%; border-radius: 14px; display: block; }
  svg.m { position: absolute; left: 0; bottom: 0; width: 1200px; height: 120px; }
</style></head>
<body>
  <img class="logo" src="../brand/logo.svg">
  <div class="tag">Schnall die Ski an.<br>Er ist hinter dir her.</div>
  <div class="ipad"><img src="../website/img/shot-play.png"></div>
  <svg class="m" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 80 Q 300 30 600 70 T 1200 60 V120 H0Z" fill="#F7FBFF"/></svg>
</body></html>
