<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gipfelsturm">
  <meta name="theme-color" content="#14213d">
  <meta name="description" content="Gipfelsturm – ein kostenloses Open-World-Ski- und Snowboardspiel mit zwölf Bergen, Liften, Challenges und Tricks.">
  <title>Gipfelsturm</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta property="og:title" content="Gipfelsturm">
  <meta property="og:description" content="Kostenloses Ski-Abenteuer in zwölf Bergwelten.">
  <meta property="og:image" content="img/og-image.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Gipfelsturm"></canvas>

  <!-- Loading -->
  <section id="loading" class="screen loading hidden">
    <div class="load-card">
      <div class="emblem small" aria-hidden="true"></div>
      <h2 id="load-name">Sonnalm</h2>
      <p id="load-region" class="muted"></p>
      <div class="bar"><i id="load-bar"></i></div>
      <p id="load-label" class="small muted" data-i18n="loading"></p>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-tl">
      <button class="round-btn" id="btn-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="16.4" width="16" height="2.6" rx="1.3"/></svg></button>
      <button class="round-btn" id="btn-map" aria-label="Karte"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div class="hud-tr">
      <div class="pill"><span class="ico">🎫</span><b id="hud-passes">0</b></div>
      <div class="pill"><span class="ico coin">◆</span><b id="hud-credits">0</b></div>
    </div>
    <div id="run-panel" class="run-panel hidden">
      <div class="run-name" id="run-name"></div>
      <div class="run-main" id="run-main"></div>
      <div class="run-sub" id="run-sub"></div>
      <div class="run-bar hidden" id="run-bar"><i></i></div>
    </div>
    <div id="trickfeed" class="trickfeed"></div>
    <div id="combo" class="combo hidden"><span id="combo-pts">0</span> <b id="combo-mult">×1</b></div>
    <div class="hud-bl">
      <div id="speedo" class="speedo"><b id="speed">0</b><span id="speed-unit">km/h</span></div>
    </div>
    <div id="prompt" class="prompt hidden"><button id="prompt-btn"></button><button id="prompt-alt" class="hidden"></button></div>
    <div id="countdown" class="countdown hidden"></div>
    <div id="touch-buttons" class="touch-buttons hidden">
      <div class="tb-left"><button data-b="left">◀</button><button data-b="right">▶</button></div>
      <div class="tb-right">
        <button data-b="pivot" title="180°">↻</button><button data-b="tap">✋</button><button data-b="grab">⤓</button>
        <button data-b="brake">▼</button><button data-b="jump" class="big">▲</button>
      </div>
    </div>
    <div id="hint-keys" class="hint-keys hidden"></div>
  </div>

  <!-- Title -->
  <section id="screen-title" class="screen hidden">
    <div class="title-wrap">
      <div class="logo-block">
        <div class="emblem" aria-hidden="true"></div>
        <h1 class="logo-text">Gipfel<span>sturm</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <button id="btn-play" class="btn btn-primary btn-xl"></button>
      <div class="menu-grid">
        <button class="btn btn-tile" data-go="mountains"><span>🏔️</span><b data-i18n="mountains"></b></button>
        <button class="btn btn-tile" data-go="gear"><span>🎿</span><b data-i18n="gear"></b></button>
        <button class="btn btn-tile" data-go="modes"><span>🌗</span><b data-i18n="modes"></b></button>
        <button class="btn btn-tile" data-go="achievements"><span>🏆</span><b data-i18n="achievements"></b></button>
        <button class="btn btn-tile" data-go="howto"><span>❓</span><b data-i18n="howto"></b></button>
        <button class="btn btn-tile" data-go="settings"><span>⚙️</span><b data-i18n="settings"></b></button>
      </div>
      <div class="title-foot">
        <div class="pill light"><span class="ico">🎫</span><b class="v-passes">0</b></div>
        <div class="pill light"><span class="ico coin">◆</span><b class="v-credits">0</b></div>
        <span class="small free" data-i18n="free"></span>
      </div>
    </div>
  </section>

  <!-- Mountains -->
  <section id="screen-mountains" class="screen panel-screen hidden">
    <div class="panel wide">
      <header><button class="back" data-back>‹</button><h2 data-i18n="mountains"></h2><div class="pill light"><span class="ico">🎫</span><b class="v-passes">0</b></div></header>
      <div id="mountain-list" class="mountain-list"></div>
    </div>
  </section>

  <!-- Gear -->
  <section id="screen-gear" class="screen panel-screen hidden">
    <div class="panel wide">
      <header><button class="back" data-back>‹</button><h2 data-i18n="gear"></h2><div class="pill light"><span class="ico coin">◆</span><b class="v-credits">0</b></div></header>
      <div class="gear-wrap">
        <div class="gear-preview">
          <canvas id="gear-canvas"></canvas>
          <div class="seg" id="sport-seg"><button data-sport="ski" data-i18n="ski"></button><button data-sport="board" data-i18n="snowboard"></button></div>
        </div>
        <div class="gear-shop">
          <div class="tabs" id="gear-tabs"></div>
          <div class="items" id="gear-items"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Modes -->
  <section id="screen-modes" class="screen panel-screen hidden">
    <div class="panel">
      <header><button class="back" data-back>‹</button><h2 data-i18n="modes"></h2><span></span></header>
      <div class="scroll">
        <label class="toggle"><span><b data-i18n="zen"></b><small data-i18n="zenHint"></small></span><input type="checkbox" id="set-zen"><i></i></label>
        <div class="row-set"><span data-i18n="timeOfDay"></span><div class="seg wrap" id="seg-tod"></div></div>
        <div class="row-set"><span data-i18n="weather"></span><div class="seg wrap" id="seg-weather"></div></div>
        <div class="row-set"><span data-i18n="npcDensity"></span><div class="seg" id="seg-npc"></div></div>
        <button class="btn btn-primary" id="btn-observe"><span data-i18n="observe"></span></button>
        <p class="small muted" data-i18n="observeHint"></p>
      </div>
    </div>
  </section>

  <!-- Settings -->
  <section id="screen-settings" class="screen panel-screen hidden">
    <div class="panel">
      <header><button class="back" data-back>‹</button><h2 data-i18n="settings"></h2><span></span></header>
      <div class="scroll">
        <div class="row-set"><span data-i18n="music"></span><input type="range" id="set-music" min="0" max="1" step="0.05"></div>
        <div class="row-set"><span data-i18n="sfx"></span><input type="range" id="set-sfx" min="0" max="1" step="0.05"></div>
        <div class="row-set"><span data-i18n="control"></span><div class="seg" id="seg-control"></div></div>
        <label class="toggle"><span data-i18n="assist"></span><input type="checkbox" id="set-assist"><i></i></label>
        <label class="toggle"><span data-i18n="haptics"></span><input type="checkbox" id="set-haptics"><i></i></label>
        <div class="row-set"><span data-i18n="quality"></span><div class="seg" id="seg-quality"></div></div>
        <div class="row-set"><span data-i18n="units"></span><div class="seg" id="seg-units"></div></div>
        <div class="row-set"><span data-i18n="language"></span><div class="seg" id="seg-lang"></div></div>
        <label class="toggle"><span><b data-i18n="unlockAll"></b><small data-i18n="unlockAllHint"></small></span><input type="checkbox" id="set-unlock"><i></i></label>
        <button class="btn btn-ghost btn-small" id="btn-reset" data-i18n="resetProgress"></button>
        <p class="small muted version">Gipfelsturm v1.0 · Fredoka (SIL OFL)</p>
      </div>
    </div>
  </section>

  <!-- Achievements -->
  <section id="screen-achievements" class="screen panel-screen hidden">
    <div class="panel wide">
      <header><button class="back" data-back>‹</button><h2 data-i18n="achievements"></h2><span></span></header>
      <div class="scroll">
        <div id="stats" class="stats-grid"></div>
        <div id="ach-list" class="ach-list"></div>
      </div>
    </div>
  </section>

  <!-- How to -->
  <section id="screen-howto" class="screen panel-screen hidden">
    <div class="panel">
      <header><button class="back" data-back>‹</button><h2 data-i18n="howto_title"></h2><span></span></header>
      <div class="scroll howto">
        <p data-i18n="ht_steer"></p><p data-i18n="ht_jump"></p><p data-i18n="ht_tricks"></p><p data-i18n="ht_grab"></p>
        <p data-i18n="ht_brake"></p><p data-i18n="ht_switch"></p><p data-i18n="ht_press"></p><p data-i18n="ht_tap"></p>
        <p data-i18n="ht_lift"></p><p data-i18n="ht_challenges"></p><p data-i18n="ht_trickList"></p>
        <p data-i18n="ht_keyboard"></p><p data-i18n="ht_gamepad"></p>
        <p class="small muted" data-i18n="rotateHint"></p>
      </div>
    </div>
  </section>

  <!-- Pause -->
  <section id="screen-pause" class="screen panel-screen hidden">
    <div class="panel narrow">
      <h2 id="pause-title"></h2>
      <button class="btn btn-primary btn-xl" id="btn-resume" data-i18n="resume"></button>
      <button class="btn" id="btn-pmap" data-i18n="map"></button>
      <button class="btn run-only" id="btn-prestart" data-i18n="restart"></button>
      <button class="btn run-only" id="btn-pabort" data-i18n="abort"></button>
      <div class="row2">
        <button class="btn btn-ghost" data-go="settings" data-i18n="settings"></button>
        <button class="btn btn-ghost" data-go="gear" data-i18n="gear"></button>
      </div>
      <div class="row2">
        <button class="btn btn-ghost" data-go="mountains" data-i18n="changeMountain"></button>
        <button class="btn btn-ghost" id="btn-home" data-i18n="mainMenu"></button>
      </div>
    </div>
  </section>

  <!-- Map -->
  <section id="screen-map" class="screen map-screen hidden">
    <canvas id="map-canvas"></canvas>
    <div class="map-top">
      <button class="round-btn" id="map-close" aria-label="Schließen">✕</button>
      <h2 id="map-title"></h2>
      <div class="map-zoom"><button class="round-btn" id="map-zin">＋</button><button class="round-btn" id="map-zout">－</button></div>
    </div>
    <div class="map-legend" id="map-legend"></div>
    <div class="map-pop hidden" id="map-pop"></div>
  </section>

  <!-- Observe -->
  <section id="screen-observe" class="observe hidden">
    <button class="btn btn-ghost" id="btn-observe-exit" data-i18n="exitObserve"></button>
  </section>

  <!-- Challenge card -->
  <section id="card-challenge" class="screen panel-screen hidden">
    <div class="panel narrow ch-card">
      <div class="ch-head"><div class="ch-icon" id="ch-icon"></div><div><h2 id="ch-name"></h2><p class="small muted" id="ch-type"></p></div></div>
      <p id="ch-desc"></p>
      <div class="medal-goals" id="ch-goals"></div>
      <p class="small" id="ch-best"></p>
      <p class="small locked-note hidden" id="ch-locked"></p>
      <button class="btn btn-primary btn-xl" id="ch-start" data-i18n="start"></button>
      <button class="btn btn-ghost" id="ch-close" data-i18n="close"></button>
    </div>
  </section>

  <!-- Result card -->
  <section id="card-result" class="screen panel-screen hidden">
    <div class="panel narrow res-card">
      <div class="res-medal" id="res-medal"></div>
      <h2 id="res-title"></h2>
      <div class="res-value" id="res-value"></div>
      <div class="badge hidden" id="res-best" data-i18n="newBest"></div>
      <div class="res-gains" id="res-gains"></div>
      <div class="medal-goals" id="res-goals"></div>
      <button class="btn btn-primary btn-xl" id="res-next" data-i18n="next"></button>
      <button class="btn btn-ghost" id="res-retry" data-i18n="retry"></button>
    </div>
  </section>

  <div id="toasts" class="toasts"></div>
  <div id="flash" class="flash"></div>

  <script src="js/util.js"></script>
  <script src="js/math3d.js"></script>
  <script src="js/mesh.js"></script>
  <script src="js/shaders.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/env.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/props.js"></script>
  <script src="js/mountains.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/npc.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/map.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
